name: NOVAFI CINEMA TV - APK piloto
on:
  push:
    branches:
      - build/novafi-cinema-tv-pilot-20261119
  workflow_dispatch:
jobs:
  compilar-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Extraer código Android
        run: |
          base64 -d novafi-cinema-tv-source.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/mx/novafi/cinema/MainActivity.java
      - name: Generar iconos temporales NOVAFI
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, struct, zlib
          def png(path,w,h):
              pixels=[]
              for y in range(h):
                  row=b''
                  for x in range(w):
                      # Fondo azul y franja de marca
                      blue=(22+int(23*y/h), 73+int(36*x/w), 138+int(36*y/h))
                      stripe = (x>w*0.12 and x<w*0.88 and abs(y-h*0.54)<h*0.07)
                      row += bytes((35,188,235) if stripe else blue)
                  pixels.append(b'\0'+row)
              def chunk(t,b): return struct.pack('>I',len(b))+t+b+struct.pack('>I',zlib.crc32(t+b)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(pixels),9))+chunk(b'IEND',b'')
              pathlib.Path(path).write_bytes(data)
          d=pathlib.Path('app/src/main/res/drawable')
          d.mkdir(parents=True,exist_ok=True)
          png(d/'novafi_icon.png',192,192)
          png(d/'novafi_banner.png',320,180)
          PY
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar plataformas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK Debug
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVAFI-CINEMA-TV-APK-PILOTO
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
